apiVersion: v1
kind: Namespace
metadata:
  name: local-datalake
---
# 1. MinIO Deployment (Local Cloud Storage Mimic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: local-datalake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "admin"
        - name: MINIO_ROOT_PASSWORD
          value: "password123"
        ports:
        - containerPort: 9000
        - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: local-datalake
spec:
  ports:
  - name: api
    port: 9000
    targetPort: 9000
    nodePort: 30090
  - name: console
    port: 9001
    targetPort: 9001
    nodePort: 30091
  selector:
    app: minio
  type: NodePort
---
# 2. Tabular Iceberg REST Catalog Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: local-datalake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iceberg-rest
  template:
    metadata:
      labels:
        app: iceberg-rest
    spec:
      containers:
      - name: iceberg-rest
        image: tabulario/iceberg-rest:latest
        env:
        # Base Warehouse configuration (Points to a default 'warehouse' bucket in MinIO)
        - name: CATALOG_WAREHOUSE
          value: "s3a://warehouse/"
        - name: CATALOG_IO__IMPL
          value: "org.apache.iceberg.aws.s3.S3FileIO"
        
        # S3 / MinIO Connection Configs
        - name: CATALOG_S3_ENDPOINT
          value: "http://minio-service:9000"
        - name: AWS_ACCESS_KEY_ID
          value: "admin"
        - name: AWS_SECRET_ACCESS_KEY
          value: "password123"
        - name: AWS_REGION
          value: "us-east-1"
        
        # CRITICAL FOR MINIO: Force Path-style URLs instead of virtual-hosted ones
        - name: CATALOG_S3_PATH__STYLE__ACCESS
          value: "true"
          
        # Optional: Persist catalog state using JDBC SQLite (instead of completely in-memory)
        - name: CATALOG_CATALOG__IMPL
          value: "org.apache.iceberg.jdbc.JdbcCatalog"
        - name: CATALOG_URI
          value: "jdbc:sqlite:file:/tmp/iceberg_metadata.db"
        - name: CATALOG_JDBC_USER
          value: "admin"
        - name: CATALOG_JDBC_PASSWORD
          value: "admin"
        ports:
        - containerPort: 8181
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest-service
  namespace: local-datalake
spec:
  ports:
  - name: api
    port: 8181
    targetPort: 8181
    nodePort: 30181
  selector:
    app: iceberg-rest
  type: NodePort